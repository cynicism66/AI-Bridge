[package]
name = "ai-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core = { path = "../../crates/bridge-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security", "Win32_UI_Notifications", "Win32_System_Com"] }
windows-core = "0.61"
webview2-com = "0.39"
webview2-core = { package = "windows-core", version = "0.62" }
