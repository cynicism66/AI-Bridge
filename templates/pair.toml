name = "结对流程"
charter = """
项目目标：{goal}
{开发甲} 和 {开发乙} 共同开发，通过 Bridge 分配本轮负责的文件。
完成实现后互相审查，通过后由本轮实现方统一提交，再开展下一轮。
"""
[[roles]]
slot = "开发甲"
duties = "实现代码与测试，审查开发乙的改动"
allow = ["读取和修改项目文件", "运行测试", "审查", "按轮次提交和推送"]
deny = ["绕过文件认领冲突", "省略相互审查"]
write = []
kickoff = true
[[roles]]
slot = "开发乙"
duties = "实现代码与测试，审查开发甲的改动"
allow = ["读取和修改项目文件", "运行测试", "审查", "按轮次提交和推送"]
deny = ["绕过文件认领冲突", "省略相互审查"]
write = []
[first_task]
content = "请根据项目目标提出首轮结对计划，与 {开发乙} 协商文件分工和验收方式，并向 human 汇报。"
[first_task_others]
content = "请与 {开发甲} 协商本轮文件分工，完成后相互审查。"
